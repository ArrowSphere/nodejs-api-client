name: Publish switch
on:
  release:
    types: [released, edited, prereleased]
  push:
    branches: [main]

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Required to create the release on push to main
  packages: write

jobs:
  create-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Create release for the package.json version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v$VERSION"

          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release version $VERSION on main: no release created."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Release or tag $TAG already exists: nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "Release $TAG created."
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    if: >-
      always() && (
        (github.event_name == 'release' && github.event.release.prerelease == false) ||
        needs.create-release.outputs.created == 'true'
      )
    uses: ./.github/workflows/publish.yaml
    permissions:
      id-token: write
      contents: read
      packages: write

  next:
    if: github.event_name == 'release' && github.event.release.prerelease == true
    uses: ./.github/workflows/pre-release-publish.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
